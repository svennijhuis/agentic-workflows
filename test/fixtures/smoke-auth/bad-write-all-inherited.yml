# Bad: workflow-level permissions write-all, smoke job has no permissions key and environment nonprod (Cursor 5654162636 f3)
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
permissions: write-all
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nonprod
    steps:
      - run: echo "smoke"
