# Bad: workflow-level id-token: write, smoke job has no permissions key and environment nonprod (SM08 f2)
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
permissions:
  id-token: write
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nonprod
    steps:
      - run: echo "smoke"
