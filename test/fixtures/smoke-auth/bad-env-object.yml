# Bad: environment is a map with the right name; only the string form passes (SM08 f2)
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: smoke-${{ inputs.env }}
    steps:
      - run: echo "smoke"
