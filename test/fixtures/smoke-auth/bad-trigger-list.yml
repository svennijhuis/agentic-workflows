# Bad: list on: with one allowed and one other name (SM08 f1)
name: smoke-auth fixture
on: [workflow_dispatch, issue_comment]
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: smoke-${{ inputs.env }}
    steps:
      - run: echo "smoke"
