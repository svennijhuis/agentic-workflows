# Bad: id-token twice in one permissions map (write, then none), environment prd (Reviewer #17 r1 case 3)
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      id-token: none
    environment: prd
    steps:
      - run: echo "smoke"
