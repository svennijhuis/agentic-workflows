# Bad: map on: with only the roles setting key, empty after the drop (SM08 f1)
name: smoke-auth fixture
on:
  roles: [admin]
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: smoke-${{ inputs.env }}
    steps:
      - run: echo "smoke"
