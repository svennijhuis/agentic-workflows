# Bad: release trigger, map on:, named nowhere in the check (the allowlist fails it)
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
  release:
    types: [published]
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: smoke-${{ inputs.env }}
    steps:
      - run: echo "smoke"
