# Bad (SM04c, Cursor 5724845468 item 3): azure/login step env takes a FAKE secrets value
name: smoke-auth fixture
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [tst, acc]
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: smoke-${{ inputs.env }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
        env:
          FAKE_LOGIN_KEY: ${{ secrets.FAKE_LOGIN_KEY }}
      - name: Get smoke token
        run: |
          TOKEN=$(az account get-access-token --scope "$SMOKE_API_SCOPE" --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SMOKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
  report:
    needs: smoke
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - run: echo "report"
