# Bad: on: 1, on_triggers exit 2 (SM08 f1)
name: smoke-auth fixture
on: 1
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "env ok"
  smoke:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: smoke-${{ inputs.env }}
    steps:
      - run: echo "smoke"
