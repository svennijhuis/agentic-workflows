name: Verify

# Manual only (POL03). Runs the same gate as local: scripts/verify.sh.
# Tool versions and sha256 come from .github/aw.json tools: (POL27). The only gate step is ./scripts/verify.sh (POL28).
# Actions is billing blocked (Q0): until it runs again, the local verify log on the exact SHA is the gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # TPL01 diffs against origin/main
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin v0.93.4
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          set +o 'errexit'
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          curl -sSfL -o yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  yq" | sha256sum -c -
          chmod +x yq
          curl -sSfL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.10.0/shellcheck
          rm -f ./*.tar.gz ./*.tar.xz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify.sh
