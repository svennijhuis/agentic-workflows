# FAKE bad POL28 case (VF02d1 round 2): LD_PRELOAD can make curl and sha256sum lie (Tester 6424839165 item 6, Cursor 5657508090 f2)
name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify
        env:
          LD_PRELOAD: /tmp/fake.so
        run: ./scripts/verify.sh
