# FAKE bad POL28 case (VF02d1 round 2): defaults.run.working-directory runs a decoy scripts/verify.sh (Cursor 5657508090 f3)
name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: decoy
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify
        run: ./scripts/verify.sh
