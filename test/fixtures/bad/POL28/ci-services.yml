# FAKE bad POL28 case (VF02d1 round 2): service container beside the gate job (Tester 6424839165 item 10)
name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      evil:
        image: ghcr.io/evil/img:latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify
        run: ./scripts/verify.sh
