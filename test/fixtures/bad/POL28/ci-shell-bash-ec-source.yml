# FAKE bad POL28 case (VF02d1 round 2): bash -ec wrapper swallows the exit code (Cursor 5657508090 f1)
name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify
        shell: bash -ec "source {0} || true"
        run: ./scripts/verify.sh
