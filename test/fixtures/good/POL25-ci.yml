# Good POL25 case: deterministic CI (no agent, no tokens spent) on pull_request is allowed by POL25.
name: Verify on PR (fixture)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: ./scripts/verify.sh
