name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw
      - name: Compile catalog templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --dir workflows --no-emit
