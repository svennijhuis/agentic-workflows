name: Verify

# One job, the same shape as githubnext/agentics ci.yml: gh aw compile --strict on workflows/ and
# .github/workflows (make compile), the POL25 and POL31 repo checks (make verify), then gitleaks.
# Manual only (POL25 keeps every workflow on workflow_dispatch). Pins come from .github/aw.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the history
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin "$(jq -r '.["gh-aw"]' .github/aw.json)"
          gh aw version
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          curl -sSfL -o yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  yq" | sha256sum -c -
          chmod +x yq
          rm -f ./*.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Compile and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify
      - name: Gitleaks
        run: gitleaks git --redact --no-banner .
