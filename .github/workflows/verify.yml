name: Verify

# Manual only (POL03). Runs the same gate as local: scripts/verify.sh.
# Actions is billing blocked (Q0): until it runs again, the local verify log on the exact SHA is the gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin v0.93.4
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          curl -sSfL -o yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && chmod +x yq
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify.sh
