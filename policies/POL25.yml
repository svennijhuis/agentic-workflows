id: POL25
title: 'Agentic workflows are workflow_dispatch only'
rule: 'An agentic workflow (gh-aw .md, its compiled .lock.yml, or a yml whose leading comment block contains gh-aw-metadata:) has workflow_dispatch as its only trigger. No schedule, no event trigger, no workflow_call and no deployment_status, even when deterministic_triggers lists the file, unless a sven_yes row names the workflow basename exactly (without .md or .lock.yml; no substring match) with a non-blank date (string or timestamp) and a non-blank quote. sven_yes never lifts deployment_status, an unlisted workflow_call, or workflow_call on an agentic file; it lifts only the agentic dispatch-only rule for other triggers such as schedule, and a .lock.yml under sven_yes may use only triggers its .md also has, and a .lock.yml under sven_yes with no sibling .md fails. Deterministic CI yml without that header is out of scope for agentic rules: POL25 fails deployment_status always and workflow_call unless governance/rollout.yml deterministic_triggers lists that file name with Sven''s exact yes in yes.date and yes.quote; pull_request, push and other triggers are not gated here (POL03 promoted: still gates them). on: is read by scripts/lib/on-triggers.sh as a string, list or map; a parse error fails closed. Config is read from $POL25_CFG (default policies/POL25.yml). SM05b, in this order: a rollout file that does not parse, or a deterministic_triggers that is not a map (list, string, null), fails every file; a missing key is an empty map. A listed entry needs a non-empty triggers list of non-empty names and yes.date and yes.quote non-empty after trim, also on a dispatch-only file. The settings keys from this file settings: are dropped before the trigger tests. Agentic classification runs before the allowlist lookup. deployment_status, workflow_call allowlist and agentic workflow_call fail before sven_yes is applied. The rollout file is $POL_ROLLOUT (tests only), else <case>/rollout.yml for a case folder (one workflow file, not rollout.yml or POL25.yml), else governance/rollout.yml.'
why: 'A loop that spends tokens or runs on its own is a one-way door: manual first, 3 audited runs, then Sven''s exact yes (PA1). Checking the lock too catches a trigger added after compile.'
check: policies/checks/POL25.sh
bad_fixture: test/fixtures/bad/POL25.md
good_fixture: test/fixtures/good/POL25.md
pbi: docs/pbi/done/POL25-agentic-dispatch-only.md
# Keys under on: that are trigger settings, not triggers.
settings: [roles, skip-bots, skip-roles]
# A schedule or event needs Sven's exact yes recorded here: {workflow, date, quote}. None today.
sven_yes: []
