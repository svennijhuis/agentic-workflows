id: POL03
title: 'Staged and dispatch first'
rule: 'Every workflow has on.workflow_dispatch. Any other trigger, and any write output without safe-outputs.staged: true, needs the workflow listed in governance/rollout.yml promoted (Sven''s exact yes). .github/workflows/*.yml and *.yaml are workflow_dispatch only on the same terms. Lock files are checked, not skipped: every *.lock.yml under .github/workflows/ and workflows/, orphan or beside its X.md, takes the same trigger checks under the promoted: name X; a lock is agentic, so workflow_call and deployment_status always fail on it. on: is read by scripts/lib/on-triggers.sh as a string, list or map; a parse error fails closed. SM05a, in this order, before the promoted: short-circuit: a rollout file that does not parse, or a deterministic_triggers that is not a map (list, string, null), fails every file; a missing key is an empty map. A listed entry (key is the file name) needs a non-empty triggers list and yes.date and yes.quote non-empty after trim, also on a dispatch-only file. The settings keys from policies/POL25.yml settings: are dropped before the trigger tests. deployment_status always fails, listed or promoted. workflow_call passes only on a non-agentic file whose entry lists it; an agentic .md, .lock.yml or gh-aw-metadata yml never gets it. An entry trigger other than workflow_dispatch and workflow_call needs promoted:. After workflow_call passes, every other trigger is workflow_dispatch or needs promoted:. A promoted: name matches only as an exact list item. The rollout file is $POL_ROLLOUT (tests only, ignored in repo mode), else <case>/rollout.yml for a case folder (one workflow file), else governance/rollout.yml.'
why: 'No scheduled or token-spending automation goes live without Sven''s explicit yes; staged runs come first.'
check: policies/checks/POL03.sh
bad_fixture: test/fixtures/bad/POL03.md
good_fixture: test/fixtures/good/POL03.md
pbi: docs/pbi/done/POL03-staged-report-only-before-writes.md
rollout: governance/rollout.yml
