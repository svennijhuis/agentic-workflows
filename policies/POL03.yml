id: POL03
title: 'Staged and dispatch first'
rule: 'Every workflow has on.workflow_dispatch. Any other trigger, and any write output without safe-outputs.staged: true, needs the workflow listed in governance/rollout.yml promoted (Sven''s exact yes). .github/workflows/*.yml are workflow_dispatch only on the same terms. on: is read by scripts/lib/on-triggers.sh as a string, list or map; a parse error fails closed. SM05a, in this order, before the promoted: short-circuit: a rollout file that does not parse, or a deterministic_triggers that is not a map (list, string, null), fails every file; a missing key is an empty map. A listed entry (key is the file name) needs a non-empty triggers list and yes.date and yes.quote non-empty after trim, also on a dispatch-only file. The settings keys from policies/POL25.yml settings: are dropped before the trigger tests. deployment_status always fails, listed or promoted. workflow_call passes only on a non-agentic file whose entry lists it; an agentic .md, .lock.yml or gh-aw-metadata yml never gets it. An entry trigger other than workflow_dispatch and workflow_call needs promoted:. After workflow_call passes, every other trigger is workflow_dispatch or needs promoted:. The rollout file is $POL_ROLLOUT, else <case>/rollout.yml for a case folder (one workflow file), else governance/rollout.yml.'
why: 'No scheduled or token-spending automation goes live without Sven''s explicit yes; staged runs come first.'
check: policies/checks/POL03.sh
bad_fixture: test/fixtures/bad/POL03.md
good_fixture: test/fixtures/good/POL03.md
pbi: docs/pbi/done/POL03-staged-report-only-before-writes.md
rollout: governance/rollout.yml
