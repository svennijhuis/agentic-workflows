id: POL24
title: 'Agent card declared'
rule: 'Every workflow has a sibling <name>.card.yml agent card. The card lists workflow, interface, harness, engine, engine_secret, tools and mcp rows (name, transport, secret). Engine and tools match the workflow frontmatter; mcp names and secret names match the compiled lock manifest. Secrets are NAMES only, never a value.'
why: 'Agent = harness config (Theo, D37). A reviewer sees what runs where without reading the lock. Secret values never land in a file (D31).'
check: policies/checks/POL24.sh
bad_fixture: test/fixtures/bad/POL24/
good_fixture: test/fixtures/good/POL24.md
pbi: docs/pbi/done/HX02-agent-card.md
required: [workflow, interface, harness, engine, engine_secret, tools, mcp]
transports: [stdio, url, shared]
secret_name: '^[A-Z][A-Z0-9_]*$'
