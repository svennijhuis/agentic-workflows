id: POL27
title: 'Verify toolchain pinned in one place'
rule: 'Every tool scripts/verify.sh installs (actionlint, gitleaks, yq, shellcheck) has one version, url and sha256 in .github/aw.json tools:, and the url names that version as its own token (1.7.1 does not match a 1.7.12 url). .github/workflows/verify.yml reads each step run: line by line (comments and blanks dropped, VF02d1) and downloads exactly those urls, each checked (C14): the only download is a top-level line that starts with plain curl and has -o FILE; any other curl spelling (\curl, /usr/bin/curl, bin/curl, command curl, a chain) and any wget or aria2c is a hit. The same run: block holds, after that curl and at the top level (no if, then, case, loop, heredoc or continuation opened before it in that block), a line that is exactly echo "<pinned sha256>  FILE" | sha256sum -c - (two spaces, nothing else on the line); any other form is not a check, and a set +e or set +o errexit (quoted or not) earlier in that block is a hit. A tar archive or chmod +x file must be a checked -o file from earlier in the same block. A continue-on-error on a step or job, or a shell: (step, job or workflow defaults) other than bash or sh that names no -e or errexit, or an env: (workflow, job or step) that sets PATH, BASH_ENV, ENV, SHELLOPTS or BASHOPTS, is a hit. gh-aw has one pin, the top-level gh-aw key, read by scripts/verify.sh and POL27; a second gh-aw pin is a hit. git, gh and jq are runner-provided and outside POL27, but scripts/verify.sh still exits 2 when one is missing. Repo-mode roots are .github/aw.json and .github/workflows/verify.yml; a missing root, an empty scan or a parse error prints file:line POL27 and exits 1.'
why: 'Local, CI and agents must run the same tool versions, or a green run proves nothing about the other place.'
check: policies/checks/POL27.sh
bad_fixture: test/fixtures/bad/POL27/
good_fixture: test/fixtures/good/POL27/
pbi: docs/pbi/done/VF01.md
pins: .github/aw.json
