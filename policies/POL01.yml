id: POL01
title: 'Pinned versions only'
rule: 'Remote imports and skills pin a 40-hex SHA or a vX.Y.Z tag. plugins: pin a vX.Y.Z tag only (C12 v1.1). agentPacks paths must be on the aw.yml agentpacks.allowlist. Actions pin a full SHA; a docker:// image pins @sha256:<64-hex>; a ./ local action is fine. A .md file is read by its frontmatter; a .yml or .yaml file is walked whole, and one that does not parse is a hit (parse error). Repo mode always walks .github/workflows/*.yml and *.yaml, plus every yml_roots glob (each *.yml glob also matches *.yaml). A missing, empty, non-list or unreadable yml_roots key, or an entry that does not end in .yml or .yaml, is a hit; a glob with no match is not.'
why: 'A branch ref changes under you. A plugins: pin at a main SHA loads zero agents (C12 correction).'
check: policies/checks/POL01.sh
bad_fixture: test/fixtures/bad/POL01.md
good_fixture: test/fixtures/good/POL01.md
pbi: docs/pbi/done/POL01-pinned-versions-only.md
# C12 v1.1 allowlist v1 (agentPacks owns the canonical list). Lives here, not in aw.yml:
# gh-aw v0.93.4 rejects unknown aw.yml properties ("Unknown property: agentpacks").
agentpacks_allowlist:
  - 'shared/standards/http-api.md'
  - 'shared/standards/testing-principles.md'
  - 'shared/standards/design.md'
  - 'shared/standards/engineering.md'
  - 'plugins/dotnet/standards/*.md'
  - 'plugins/rust/standards/*.md'
  - 'plugins/typescript/standards/*.md'
  - 'plugins/squad/commands/squad-review.md'
  - 'plugins/squad/skills/squad'
  - 'plugins/squad'
# Repo-mode yml roots added to the always-on .github/workflows/*.yml (VF02a). *.lock.yml is skipped.
yml_roots:
  - '.github/workflows/*.yml'
  - 'workflows/shared/verify/*.yml'
# M05 repo allowlist (one allowlist file). POL12 holds every entry to owner svennijhuis. Empty until M05 B3.
m05_repos: []
