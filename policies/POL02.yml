id: POL02
title: 'Cost caps required'
rule: 'Every workflow sets max-ai-credits, max-daily-ai-credits, max-turns and timeout-minutes in its own frontmatter, at or below the ceilings.'
why: 'The compiler ignores caps in imports. gh-aw defaults (1000 per run, 5000 per day) would burn Copilot Pro credits.'
check: policies/checks/POL02.sh
bad_fixture: test/fixtures/bad/POL02.md
good_fixture: test/fixtures/good/POL02.md
pbi: docs/pbi/done/POL02-cost-caps-required.md
ceilings:
  max-ai-credits: 50
  max-daily-ai-credits: 200
  max-turns: 30
  timeout-minutes: 30
