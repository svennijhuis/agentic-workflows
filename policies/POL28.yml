id: POL28
title: 'One verify entry point'
rule: 'A .github/workflows/*.yml step that gates runs ./scripts/verify.sh and nothing else; no step runs gh aw compile, actionlint or shellcheck on its own. AGENTS.md, CONTRIBUTING.md, .github/copilot-instructions.md and .github/skills/verify-aw/SKILL.md each name scripts/verify.sh. Repo-mode roots are .github/workflows/*.yml (not *.lock.yml) and those four files; a missing root, an empty scan or a parse error prints file:line POL28 and exits 1.'
why: 'One command decides green or red for CI, humans and every agent, so verify it needs no setup talk.'
check: policies/checks/POL28.sh
bad_fixture: test/fixtures/bad/POL28/
good_fixture: test/fixtures/good/POL28/
pbi: docs/pbi/done/VF01.md
pins: .github/aw.json
