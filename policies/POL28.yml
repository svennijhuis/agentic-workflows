id: POL28
title: 'One verify entry point'
rule: 'An allowlist of run shapes, not a tool list (VF02d1): every shell line of every step run: in a .github/workflows/*.yml or *.yaml (not *.lock.yml) matches one run_allow: regex below as a whole line, comments and blanks dropped, and anything else (bash -c, if, go run, npx, make, sudo -u root actionlint and the rest) is a hit. The install shapes (gh extension install at the pin, mkdir and cd into $HOME/bin, plain curl -o FILE https url, the exact sha256 check line, tar, chmod +x, rm -f ./glob, $HOME/bin to GITHUB_PATH) are the setup_allow: list and count only in a file named verify.yml, where POL27 checks every download; anywhere else only run_allow counts, so no other workflow can fetch or place a binary before ./scripts/verify.sh. A missing, empty or non-list run_allow or setup_allow, or an entry that is not a non-empty valid regex, is a hit (fail closed). The keys around the run lines are an allowlist too (VF02d1 round 2): a YAML anchor or alias is a hit; top-level keys only name, run-name, on, permissions, concurrency, jobs, env, defaults; permissions exactly contents: read; job keys only name, runs-on (ubuntu-latest), timeout-minutes, permissions, steps, defaults, env, so if, container, services and continue-on-error are hits; step keys only name, id, uses, with, run, env, shell, timeout-minutes, so if, working-directory and continue-on-error are hits; shell: only bash, sh or bash --noprofile --norc -eo pipefail {0}; defaults only run.shell; every env: is a plain map whose only entry is GH_TOKEN: ${{ github.token }}; uses: only actions/checkout@<40 hex>, one per workflow, with: only persist-credentials: false and a numeric fetch-depth. A step that gates runs ./scripts/verify.sh and nothing else, and a verify*.yml or verify*.yaml has that step. AGENTS.md, CONTRIBUTING.md, .github/copilot-instructions.md and .github/skills/verify-aw/SKILL.md each name scripts/verify.sh. Repo-mode roots are .github/workflows/*.yml and *.yaml (not *.lock.yml) and those four files; a missing root, an empty scan or a parse error prints file:line POL28 and exits 1.'
why: 'One command decides green or red for CI, humans and every agent, so verify it needs no setup talk.'
check: policies/checks/POL28.sh
bad_fixture: test/fixtures/bad/POL28/
good_fixture: test/fixtures/good/POL28/
pbi: docs/pbi/done/VF01.md
pins: .github/aw.json
# VF02d1: every shell line of every step run: in a .github/workflows/*.yml or *.yaml (not *.lock.yml) must
# match one run_allow regex as a whole line (grep -xE). setup_allow adds the install shapes, only in a file
# named verify.yml (POL27 checks every download there). Missing, empty or non-list is a hit (fail closed).
run_allow:
  - 'set -euo pipefail'
  - './scripts/verify.sh'
setup_allow:
  - 'gh extension install github/gh-aw --pin v[0-9]+\.[0-9]+\.[0-9]+'
  - 'mkdir -p "\$HOME/bin" && cd "\$HOME/bin"'
  - 'curl( -[A-Za-z]+)* -o [A-Za-z0-9._-]+ https://[A-Za-z0-9._/:~%+=-]+'
  - 'echo "[0-9a-f]{64}  [A-Za-z0-9._-]+" \| sha256sum -c -'
  - 'tar [A-Za-z]+ [A-Za-z0-9._-]+( --strip-components=[0-9]+)?( [A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)*'
  - 'chmod \+x [A-Za-z0-9._-]+'
  - 'rm -f( \./\*?[A-Za-z0-9._-]*\*?[A-Za-z0-9._-]*)+'
  - 'echo "\$HOME/bin" >> "\$GITHUB_PATH"'
